<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <title>William Luca Costa</title>
    <script>
      // Single-page-app redirect for GitHub Pages.
      // Encodes the requested path into a query string and bounces to /
      // index.html will decode it and restore the real URL via history.replaceState.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
