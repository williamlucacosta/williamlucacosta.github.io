    <script>
      // Decode SPA redirect from 404.html.
      // Converts /?/path/to/page back into /path/to/page via history.replaceState
      // so vue-router can mount the right view on first load.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
